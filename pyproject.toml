# Single source of truth for the Python side.
#
#   pipx install uv          # get uv itself, isolated from every project
#   uv sync                  # create .venv and install everything
#   uv run python/examples/01_pinhole_projection.py
#
# uv creates and manages .venv for you -- there is no `python -m venv` step and
# no `pip install` anywhere in this repository.
[project]
name = "learn-camera-intrinsics"
version = "1.0.0"
description = "An interactive course on camera intrinsics: the K matrix and the D vector"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.5",
]

[project.urls]
Homepage = "https://github.com/cyhunblr/learn_camera_intrinsics"

[dependency-groups]
# Installed by `uv sync`, skipped by `uv sync --no-dev`.
dev = [
    "pytest>=6.0",   # the exercise autograder under pytest
    "pillow>=8.0",   # only used by scripts/generate_figures.sh to shrink PNGs
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package lives under python/ so the C++ half can sit beside it.
packages = ["python/camintrinsics"]

[tool.pytest.ini_options]
testpaths = ["python/exercises"]
